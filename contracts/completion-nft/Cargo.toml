[package]
name = "completion-nft"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.0", features = ["legacy"] }
near-contract-standards = "=5.30.0"
# SDK 5.30.0 calls these host symbols unconditionally; near-sys 0.4.1 gates them.
# The contract does not use universal-account functionality.
near-sys = { version = "=0.4.1", features = ["universal-accounts"] }

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["legacy", "unit-testing"] }
