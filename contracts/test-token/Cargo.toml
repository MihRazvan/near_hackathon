publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.30.0", features = ["legacy", "deterministic-account-ids"] }
near-contract-standards = "=5.30.0"
near-sys = { version = "=0.4.1", features = ["universal-accounts"] }
