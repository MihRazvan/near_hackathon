[workspace]
resolver = "2"
members = [
    "contracts/marketplace",
    "contracts/campaign-marketplace",
    "contracts/marketplace-hub",
    "contracts/completion-nft",
    "contracts/test-token",
    "contracts/test-intents",
    "contracts/storefront-factory",
    "contracts/campaign-factory",
    "contracts/empty-campaign-refresh",
    "proofs/sandbox",
]

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
